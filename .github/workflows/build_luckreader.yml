name: Build LuckReader APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: 'ubuntu-24.04'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Generate Stable Signing Keystore
        run: |
          keytool -genkeypair -v \
            -keystore luckreader.keystore \
            -alias luckreader \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "luckreader123" \
            -keypass "luckreader123" \
            -dname "CN=LuckReader, OU=LuckDev, O=Luck, L=City, ST=State, C=US"
          
          cat << 'EOF' > keystore.properties
          storeFile=../luckreader.keystore
          storePassword=luckreader123
          keyAlias=luckreader
          keyPassword=luckreader123
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Prepare APKs
        run: |
          mkdir -p build-artifacts
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} build-artifacts/ \;
          ls -la build-artifacts/

      - name: Upload APKs to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LuckReader-APKs
          path: build-artifacts/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build-artifacts/*.apk
          name: LuckReader ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
