name: Build LuckReader APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: 'ubuntu-24.04'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Standard Debug APK
        run: ./gradlew assembleStandardDebug

      - name: Rename APK
        run: |
          mkdir -p build-artifacts
          cp app/build/outputs/apk/standard/debug/*.apk build-artifacts/LuckReader-debug.apk || cp $(find app/build/outputs/apk -name "*.apk" | head -n 1) build-artifacts/LuckReader-debug.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LuckReader-APK
          path: build-artifacts/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build-artifacts/LuckReader-debug.apk
          name: LuckReader ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
